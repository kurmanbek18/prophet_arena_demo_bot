<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crypto Arena v4.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { background: #0b0f19; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
  .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  .tap-btn:active { transform: scale(0.95); transition: 0.1s; }
  .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
  .glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
</style>
</head>
<body class="pb-24">

<header class="p-4 glass sticky top-0 z-50 flex justify-between items-center">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-lg" id="avatar">🔮</div>
    <div>
      <div id="username" class="font-bold text-sm">Трейдер</div>
      <div id="level" class="text-xs text-cyan-400">HODL Новичок</div>
    </div>
  </div>
  <div class="text-right">
    <div class="text-[10px] text-slate-400">БАЛАНС</div>
    <div class="text-base font-black text-emerald-400"><span id="balance">1,000</span> USDT</div>
  </div>
</header>

<main class="p-4 space-y-4 max-w-md mx-auto">
  <section id="tab-duels" class="space-y-4">
    <div class="glass p-4 rounded-2xl space-y-3">
      <h2 class="text-lg font-bold flex items-center gap-2">⚔️ Быстрая PvP Дуэль</h2>
      <p class="text-xs text-slate-400">Выбери актив и жми направление в 1 клик!</p>
      
      <div class="grid grid-cols-4 gap-2" id="coin-picker">
        <button onclick="setCoin('BTC')" class="coin-btn p-2 rounded-xl glass text-center border-cyan-500 border" data-coin="BTC"><div class="text-xs font-bold">BTC</div></button>
        <button onclick="setCoin('ETH')" class="coin-btn p-2 rounded-xl glass text-center" data-coin="ETH"><div class="text-xs font-bold">ETH</div></button>
        <button onclick="setCoin('TON')" class="coin-btn p-2 rounded-xl glass text-center" data-coin="TON"><div class="text-xs font-bold">TON</div></button>
        <button onclick="setCoin('SOL')" class="coin-btn p-2 rounded-xl glass text-center" data-coin="SOL"><div class="text-xs font-bold">SOL</div></button>
      </div>

      <div class="flex gap-2">
        <input id="duel-amount" type="number" value="25" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center font-bold text-sm" placeholder="Ставка USDT">
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="makeDuel('up')" class="tap-btn bg-emerald-600 hover:bg-emerald-500 glow-green p-4 rounded-2xl text-center font-black text-lg flex flex-col items-center justify-center">
          <span>🟢 РОСТ</span>
          <span class="text-[10px] font-normal opacity-80">Вверх</span>
        </button>
        <button onclick="makeDuel('down')" class="tap-btn bg-rose-600 hover:bg-rose-500 glow-red p-4 rounded-2xl text-center font-black text-lg flex flex-col items-center justify-center">
          <span>🔴 ПАДЕНИЕ</span>
          <span class="text-[10px] font-normal opacity-80">Вниз</span>
        </button>
      </div>
    </div>
  </section>

  <section id="tab-friends" class="space-y-4 hidden">
    <div class="glass p-5 rounded-2xl text-center space-y-3">
      <div class="text-4xl">🤝</div>
      <h2 class="text-xl font-bold">Приглашай друзей</h2>
      <p class="text-xs text-slate-400">Зарабатывай <b>+100 USDT</b> за каждого друга и получай <b>10% от побед</b>!</p>
      <button onclick="copyRefLink()" class="tap-btn w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl font-bold text-sm shadow-lg shadow-cyan-900/40">🔗 Скопировать ссылку</button>
    </div>
    <div class="glass p-4 rounded-2xl space-y-3">
      <div class="flex justify-between items-center text-xs"><span class="text-slate-400">Друзей</span><b id="ref-count" class="text-cyan-400 text-sm">0</b></div>
      <div class="flex justify-between items-center text-xs"><span class="text-slate-400">Заработано</span><b id="ref-earned" class="text-emerald-400 text-sm">0 USDT</b></div>
    </div>
  </section>
</main>

<nav class="fixed bottom-0 inset-x-0 glass border-t border-slate-800 grid grid-cols-2 p-2 z-50">
  <button onclick="switchTab('duels')" class="flex flex-col items-center text-cyan-400 font-bold text-xs py-1"><span class="text-xl">⚔️</span> Арена</button>
  <button onclick="switchTab('friends')" class="flex flex-col items-center text-slate-400 font-bold text-xs py-1"><span class="text-xl">🤝</span> Друзья</button>
</nav>

<script>
const API = "https://prediction-arena-backend.onrender.com";
let selectedCoin = "BTC";
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

function setCoin(coin) {
  selectedCoin = coin;
  document.querySelectorAll('.coin-btn').forEach(b => {
    b.classList.toggle('border-cyan-500', b.dataset.coin === coin);
    b.classList.toggle('border', b.dataset.coin === coin);
  });
}

function switchTab(tab) {
  document.getElementById('tab-duels').classList.toggle('hidden', tab !== 'duels');
  document.getElementById('tab-friends').classList.toggle('hidden', tab !== 'friends');
  if (tab === 'friends') loadFriends();
}

async function makeDuel(pred) {
  const amt = parseFloat(document.getElementById('duel-amount').value);
  try {
    const res = await fetch(API + '/api/duels/create', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({coin: selectedCoin, prediction: pred, amount: amt})
    });
    const data = await res.json();
    if (res.ok) {
      tg?.HapticFeedback?.notificationOccurred('success');
      alert('⚔️ Вызов создан!');
    } else alert(data.detail);
  } catch(e) { alert('Ошибка сети'); }
}

function copyRefLink() {
  const link = `https://t.me/your_bot?start=ref_${tg?.initDataUnsafe?.user?.id || 'web'}`;
  navigator.clipboard.writeText(link);
  alert('Ссылка скопирована!');
}

async function loadFriends() {
  try {
    const res = await fetch(API + '/api/friends');
    const data = await res.json();
    document.getElementById('ref-count').textContent = data.total;
    document.getElementById('ref-earned').textContent = data.earned + ' USDT';
  } catch(e){}
}
</script>
</body>
</html>
