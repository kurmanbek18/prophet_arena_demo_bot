<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Arena Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased pb-24">

    <!-- Шапка профиля -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
        <div>
            <span id="user-level" class="text-xs px-2 py-1 bg-amber-500/20 text-amber-400 rounded-full font-semibold">Хомяк-новичок</span>
            <h1 id="username" class="text-lg font-bold mt-1">Трейдер</h1>
        </div>
        <div class="text-right">
            <div class="text-xs text-slate-400">Баланс</div>
            <div class="text-lg font-black text-emerald-400"><span id="user-balance">1000.00</span> USDT</div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="p-4 max-w-md mx-auto">
        
        <!-- Вкладка 1: Биржа и Рынок -->
        <section id="tab-market" class="space-y-4">
            <h2 class="text-xl font-bold">📈 Живой рынок</h2>
            <div id="crypto-list" class="space-y-3">
                <div class="p-4 bg-slate-900 rounded-xl border border-slate-800 animate-pulse">Загрузка котировок...</div>
            </div>
        </section>

        <!-- Вкладка 2: Арена прогнозов (Сделки) -->
        <section id="tab-arena" class="space-y-4 hidden">
            <h2 class="text-xl font-bold">⚡ Предикшн-Арена</h2>
            <div class="p-5 bg-slate-900 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex justify-between">
                    <span class="text-slate-400">Актив:</span>
                    <span class="font-bold text-cyan-400">Bitcoin (BTC/USD)</span>
                </div>
                <div>
                    <label class="text-sm text-slate-400">Сумма ставки (USDT):</label>
                    <input type="number" id="bet-amount" value="100" class="w-full mt-1 p-3 bg-slate-800 rounded-xl border border-slate-700 text-white font-bold focus:outline-none focus:border-cyan-500">
                </div>
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="makeTrade('up')" class="p-4 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl transition shadow-lg shadow-emerald-900/40">🟢 Рост (LONG)</button>
                    <button onclick="makeTrade('down')" class="p-4 bg-rose-600 hover:bg-rose-500 font-bold rounded-xl transition shadow-lg shadow-rose-900/40">🔴 Падение (SHORT)</button>
                </div>
                <div id="trade-result" class="text-center text-sm font-medium mt-2 text-slate-400"></div>
            </div>
        </section>

        <!-- Вкладка 3: Лидеры -->
        <section id="tab-leaderboard" class="space-y-4 hidden">
            <h2 class="text-xl font-bold">🏆 Топ Трейдеров</h2>
            <div id="leaderboard-list" class="space-y-2">
                <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 text-center text-slate-400">Загрузка рейтинга...</div>
            </div>
        </section>

        <!-- Вкладка 4: Дуэли 1 на 1 -->
        <section id="tab-duels" class="space-y-4 hidden">
            <h2 class="text-xl font-bold">⚔️ Дуэли с другом</h2>
            <div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                <h3 class="font-semibold text-cyan-400">Создать дуэль</h3>
                <input type="number" id="duel-amount" value="50" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 text-white font-bold">
                <button onclick="createDuel()" class="w-full p-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition">Выставить ставку</button>
            </div>
            
            <div class="space-y-2">
                <h3 class="font-semibold text-slate-300">Активные вызовы:</h3>
                <div id="duels-list" class="space-y-2">
                    <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 text-center text-slate-400">Загрузка дуэлей...</div>
                </div>
            </div>
            <div id="duel-result" class="text-center font-bold text-sm"></div>
        </section>

    </main>

    <!-- Нижняя навигация -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around p-3 z-50">
        <button onclick="switchTab('market', this)" class="nav-btn text-cyan-400 font-bold text-xs flex flex-col items-center">📊 <span>Биржа</span></button>
        <button onclick="switchTab('arena', this)" class="nav-btn text-slate-400 font-bold text-xs flex flex-col items-center">⚡ <span>Арена</span></button>
        <button onclick="switchTab('leaderboard', this)" class="nav-btn text-slate-400 font-bold text-xs flex flex-col items-center">🏆 <span>Лидеры</span></button>
        <button onclick="switchTab('duels', this)" class="nav-btn text-slate-400 font-bold text-xs flex flex-col items-center">⚔️ <span>Дуэли</span></button>
    </nav>

    <script>
        const API_URL = "https://prediction-arena-backend.onrender.com";
        const telegramId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id?.toString() || "test_user_" + Math.floor(Math.random()*1000);

        async function loadUser() {
            try {
                let res = await fetch(`${API_URL}/api/user/${telegramId}`);
                let user = await res.json();
                document.getElementById('user-balance').innerText = user.balance.toFixed(2);
                document.getElementById('user-level').innerText = user.level;
                document.getElementById('username').innerText = user.username;
            } catch (e) { console.error(e); }
        }

        async function loadMarket() {
            try {
                let res = await fetch(`${API_URL}/api/market`);
                let data = await res.json();
                let container = document.getElementById('crypto-list');
                container.innerHTML = '';
                for (let [coin, info] of Object.entries(data)) {
                    let changeColor = info.change >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    container.innerHTML += `
                        <div class="p-4 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center">
                            <div>
                                <span class="font-bold text-lg">${coin}</span>
                                <div class="text-xs text-slate-400">Spot Market</div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold">$${info.price.toLocaleString()}</div>
                                <div class="text-xs ${changeColor}">${info.change > 0 ? '+' : ''}${info.change}%</div>
                            </div>
                        </div>
                    `;
                }
            } catch (e) { console.error(e); }
        }

        async function makeTrade(direction) {
            let amount = parseFloat(document.getElementById('bet-amount').value);
            let resultDiv = document.getElementById('trade-result');
            resultDiv.innerText = "⏳ Обработка сделки...";
            try {
                let res = await fetch(`${API_URL}/api/trade`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ telegram_id: telegramId, amount: amount, direction: direction })
                });
                let data = await res.json();
                if (res.ok) {
                    resultDiv.innerText = data.message;
                    resultDiv.className = data.success ? "text-center text-sm font-bold mt-2 text-emerald-400" : "text-center text-sm font-bold mt-2 text-rose-400";
                    loadUser();
                } else {
                    resultDiv.innerText = data.detail || "Ошибка сделки";
                }
            } catch (e) {
                resultDiv.innerText = "Ошибка соединения с сервером";
            }
        }

        async function loadLeaderboard() {
            try {
                let res = await fetch(`${API_URL}/api/leaderboard`);
                let leaders = await res.json();
                let container = document.getElementById('leaderboard-list');
                container.innerHTML = '';
                leaders.forEach((u, index) => {
                    container.innerHTML += `
                        <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <span class="font-bold text-amber-400">#${index + 1}</span>
                                <div>
                                    <div class="font-semibold">${u.username}</div>
                                    <div class="text-xs text-slate-400">${u.level}</div>
                                </div>
                            </div>
                            <div class="font-bold text-emerald-400">${u.balance.toFixed(0)} USDT</div>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        async function loadDuels() {
            try {
                let res = await fetch(`${API_URL}/api/duels`);
                let duels = await res.json();
                let container = document.getElementById('duels-list');
                container.innerHTML = '';
                if (duels.length === 0) {
                    container.innerHTML = '<div class="p-3 bg-slate-900 rounded-xl border border-slate-800 text-center text-slate-400">Нет активных дуэлей</div>';
                    return;
                }
                duels.forEach(d => {
                    container.innerHTML += `
                        <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center">
                            <div>
                                <div class="font-bold">${d.creator}</div>
                                <div class="text-xs text-emerald-400">Ставка: ${d.amount} USDT</div>
                            </div>
                            <button onclick="joinDuel(${d.id})" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-sm">Принять</button>
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        async function createDuel() {
            let amount = parseFloat(document.getElementById('duel-amount').value);
            let res = await fetch(`${API_URL}/api/duels/create`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telegram_id: telegramId, amount: amount })
            });
            let data = await res.json();
            alert(data.message || data.detail);
            loadUser();
            loadDuels();
        }

        async function joinDuel(duelId) {
            let res = await fetch(`${API_URL}/api/duels/join`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ duel_id: duelId, telegram_id: telegramId })
            });
            let data = await res.json();
            if(res.ok) {
                document.getElementById('duel-result').innerText = `🎉 Победитель: ${data.winner}! Банк: +${data.prize} USDT`;
                document.getElementById('duel-result').className = "text-center font-bold text-sm text-emerald-400 mt-2";
                loadUser();
                loadDuels();
            } else {
                alert(data.detail);
            }
        }

        function switchTab(tab, btn) {
            document.getElementById('tab-market').classList.add('hidden');
            document.getElementById('tab-arena').classList.add('hidden');
            document.getElementById('tab-leaderboard').classList.add('hidden');
            document.getElementById('tab-duels').classList.add('hidden');
            
            document.getElementById(`tab-${tab}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-cyan-400', 'text-slate-400'));
            btn.classList.replace('text-slate-400', 'text-cyan-400');

            if(tab === 'market') loadMarket();
            if(tab === 'leaderboard') loadLeaderboard();
            if(tab === 'duels') loadDuels();
        }

        loadUser();
        loadMarket();
        setInterval(loadMarket, 10000);
    </script>
</body>
</html>
