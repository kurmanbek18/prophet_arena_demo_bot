<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Arena</title>
    <!-- Подключаем Tailwind CSS для красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ (Профиль и Баланс) -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
        <div>
            <div id="user-level" class="text-xs text-amber-400 font-semibold uppercase tracking-wider">Хомяк-новичок</div>
            <div class="text-lg font-bold flex items-center gap-1">
                <span id="user-balance">1000.00</span> <span class="text-xs text-slate-400">USDT</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <!-- Переключатель языка -->
            <button onclick="toggleLanguage()" id="lang-btn" class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-lg text-xs font-bold border border-slate-700 transition">
                RU
            </button>
            <div class="text-right">
                <div id="user-xp" class="text-xs text-slate-400">0 XP</div>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="flex-1 p-4 overflow-y-auto pb-20">
        
        <!-- Вкладка 1: Биржа (Рынок) -->
        <div id="tab-market" class="space-y-4">
            <h2 id="txt-market-title" class="text-xl font-extrabold tracking-tight">Биржа монет</h2>
            <div id="tokens-list" class="space-y-3">
                <!-- Сюда динамически загружаются монеты -->
                <div class="text-center text-slate-500 py-10">Загрузка рынка...</div>
            </div>
        </div>

        <!-- Вкладка 2: Лидеры -->
        <div id="tab-leaderboard" class="space-y-4 hidden">
            <h2 id="txt-lb-title" class="text-xl font-extrabold tracking-tight">Топ трейдеров (Глобал)</h2>
            <div id="leaderboard-list" class="space-y-2">
                <!-- Сюда загружается топ -->
                <div class="text-center text-slate-500 py-10">Загрузка лидеров...</div>
            </div>
        </div>

    </main>

    <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur border-t border-slate-800 flex justify-around p-3 z-50">
        <button onclick="switchTab('market')" id="nav-market" class="flex flex-col items-center text-amber-400 font-medium text-xs transition">
            <span class="text-lg">📈</span>
            <span id="lbl-market">Биржа</span>
        </button>
        <button onclick="switchTab('leaderboard')" id="nav-lb" class="flex flex-col items-center text-slate-400 font-medium text-xs transition">
            <span class="text-lg">🏆</span>
            <span id="lbl-lb">Лидеры</span>
        </button>
    </nav>

    <!-- СКРИПТЫ ЛОГИКИ И ПЕРЕВОДОВ -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Определяем Telegram ID пользователя (или тестовый, если открыто в обычном браузере)
        const user = tg.initDataUnsafe?.user;
        const telegramId = user ? String(user.id) : "test_user_123";
        let currentLang = user?.language_code === 'ru' ? 'ru' : 'en';

        // Словари переводов (RU / EN)
        const translations = {
            ru: { market: "Биржа монет", leaderboard: "Топ трейдеров", buy: "Купить", navMarket: "Биржа", navLb: "Лидеры" },
            en: { market: "Token Exchange", leaderboard: "Leaderboard", buy: "Buy", navMarket: "Market", navLb: "Leaderboard" }
        };

        function updateTexts() {
            document.getElementById('lang-btn').innerText = currentLang.toUpperCase();
            document.getElementById('txt-market-title').innerText = translations[currentLang].market;
            document.getElementById('txt-lb-title').innerText = translations[currentLang].leaderboard;
            document.getElementById('lbl-market').innerText = translations[currentLang].navMarket;
            document.getElementById('lbl-lb').innerText = translations[currentLang].navLb;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            updateTexts();
            loadTokens();
        }

        function switchTab(tab) {
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            
            const isMarket = tab === 'market';
            document.getElementById('tab-market').classList.toggle('hidden', !isMarket);
            document.getElementById('tab-leaderboard').classList.toggle('hidden', isMarket);

            document.getElementById('nav-market').className = isMarket ? "flex flex-col items-center text-amber-400 font-medium text-xs transition" : "flex flex-col items-center text-slate-400 font-medium text-xs transition";
            document.getElementById('nav-lb').className = !isMarket ? "flex flex-col items-center text-amber-400 font-medium text-xs transition" : "flex flex-col items-center text-slate-400 font-medium text-xs transition";

            if (!isMarket) loadLeaderboard();
        }

        // Загрузка данных пользователя
        async function loadUserData() {
            try {
                const res = await fetch(`/api/user/${telegramId}`);
                const data = await res.json();
                document.getElementById('user-balance').innerText = data.balance.toFixed(2);
                document.getElementById('user-xp').innerText = `${data.xp} XP`;
                document.getElementById('user-level').innerText = data.level;
                if (data.language) currentLang = data.language;
                updateTexts();
            } catch (e) {
                console.error("Ошибка загрузки профиля", e);
            }
        }

        // Загрузка списка монет с бэкенда
        async function loadTokens() {
            try {
                const res = await fetch('/api/tokens');
                const tokens = await res.json();
                const container = document.getElementById('tokens-list');
                container.innerHTML = "";

                tokens.forEach(token => {
                    const isPositive = token.change_24h >= 0;
                    const changeColor = isPositive ? 'text-emerald-400' : 'text-rose-400';
                    const changeSign = isPositive ? '+' : '';

                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl flex items-center justify-between shadow-sm">
                            <div>
                                <div class="font-bold text-sm flex items-center gap-2">
                                    ${token.symbol} 
                                    <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-normal">${token.name}</span>
                                </div>
                                <div class="text-xs text-slate-400 mt-0.5">$${token.price.toFixed(4)}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-right">
                                    <div class="text-xs font-semibold ${changeColor}">${changeSign}${token.change_24h}%</div>
                                </div>
                                <button onclick="alert('Покупка ${token.symbol} в разработке!')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg transition active:scale-95">
                                    ${translations[currentLang].buy}
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Ошибка загрузки монет", e);
            }
        }

        // Загрузка таблицы лидеров
        async function loadLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const users = await res.json();
                const container = document.getElementById('leaderboard-list');
                container.innerHTML = "";

                users.forEach((u, index) => {
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-slate-500 w-5">#${index + 1}</span>
                                <div>
                                    <div class="font-semibold text-sm">${u.username}</div>
                                    <div class="text-[10px] text-amber-400">${u.level}</div>
                                </div>
                            </div>
                            <div class="text-xs font-bold text-slate-300">${u.xp} XP</div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Ошибка загрузки таблицы лидеров", e);
            }
        }

        // Инициализация при старте
        loadUserData();
        loadTokens();
        // Автообновление цен на рынке каждые 7 секунд
        setInterval(loadTokens, 7000);
    </script>
</body>
</html>
